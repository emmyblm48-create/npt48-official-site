<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official - NEWS & SCHEDULE</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Kanit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">What's Coming Up</span>
      <h1 class="page-hero-title">Schedule</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>กำลังโหลดข้อมูล NPT48...</div>
    </div>

    <div id="schedule-view">
      <div class="filter-tabs" id="filterChips">
        <button class="tab-btn active" data-type="ALL">ทั้งหมด</button>
        <button class="tab-btn" data-type="EVENT">อีเวนต์</button>
        <button class="tab-btn" data-type="MEDIA">สื่อ</button>
        <button class="tab-btn" data-type="LIVE">ไลฟ์</button>
        <button class="tab-btn" data-type="RELEASE">วางจำหน่าย</button>
      </div>
      <div id="schedule-list" class="schedule-list"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var scheduleData = [];
    var currentTypeFilter = 'ALL';

    var TYPE_MAP = {
      EVENT: { kicker: 'kicker-outline', label: 'อีเวนต์' },
      MEDIA: { kicker: 'kicker-gold', label: 'สื่อ' },
      LIVE: { kicker: 'kicker-live', label: 'ไลฟ์' },
      RELEASE: { kicker: 'kicker-dark', label: 'วางจำหน่าย' }
    };

    var DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Schedule')
        .then(function (data) {
          if (!Array.isArray(data)) throw new Error((data && data.error) || 'Invalid schedule data');
          scheduleData = data.slice().sort(function (a, b) {
            return parseDate(a.date).sortKey - parseDate(b.date).sortKey;
          });
          renderList('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('schedule-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง';
        });
    }

    document.getElementById('filterChips').querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#filterChips .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTypeFilter = btn.getAttribute('data-type');
        renderList(currentTypeFilter);
      });
    });

    function parseDate(raw) {
      var d = new Date(raw);
      if (isNaN(d.getTime())) {
        return { dayName: '—', dayNum: String(raw || '-'), month: '', year: '', sortKey: 0 };
      }
      return {
        dayName: DAY_NAMES[d.getDay()],
        dayNum: d.getDate(),
        month: MONTH_NAMES[d.getMonth()],
        year: String(d.getFullYear()).slice(-2),
        sortKey: d.getTime()
      };
    }

    function renderList(type) {
      var list = document.getElementById('schedule-list');
      var filtered = type === 'ALL' ? scheduleData : scheduleData.filter(function (s) {
        return (s.type || '').toString().toUpperCase() === type;
      });

      if (!filtered.length) {
        list.innerHTML = '<p class="schedule-empty">ยังไม่มีตารางงานในตอนนี้</p>';
        return;
      }

      list.innerHTML = filtered.map(function (s) {
        var typeKey = (s.type || '').toString().toUpperCase();
        var meta = TYPE_MAP[typeKey] || { kicker: 'kicker-outline', label: s.type || '' };
        var d = parseDate(s.date);
        var tag = s.link ? 'a' : 'div';
        var linkAttrs = s.link ? ' href="' + s.link + '" target="_blank" rel="noopener"' : '';
        return '' +
          '<' + tag + ' class="day-card"' + linkAttrs + '>' +
            '<div class="date-box"><span class="date-day">' + d.dayName + '</span><span class="date-num">' + d.dayNum + ' ' + d.month + ' ' + d.year + '</span></div>' +
            '<div class="event-info">' +
              '<div class="event-time"><i class="far fa-clock"></i> ' + (s.time || '') + (s.place ? ' · ' + s.place : '') + '</div>' +
              '<div class="event-title">' + s.title + '</div>' +
            '</div>' +
            '<span class="kicker ' + meta.kicker + ' status-tag">' + meta.label + '</span>' +
          '</' + tag + '>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
