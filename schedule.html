<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07070d">
  <title>NPT48 Official - NEWS & SCHEDULE</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    #schedule-view { display: none; }

    .diary-list { max-width: 720px; margin: 0 auto; }
    .diary-item { display: grid; grid-template-columns: 74px 1fr; gap: 18px; position: relative; }
    .diary-rail { display: flex; flex-direction: column; align-items: center; }
    .diary-stamp {
      width: 68px; height: 68px; border-radius: 50%; background: var(--bg-2); color: var(--holo-cyan);
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-mono);
      border: 1px solid var(--line-strong); box-shadow: var(--shadow-soft); flex-shrink: 0; position: relative; z-index: 1;
    }
    .diary-stamp::before {
      content: ''; position: absolute; inset: -3px; border-radius: 50%; z-index: -1;
      background: conic-gradient(from 0deg, var(--holo-blue), var(--holo-purple), var(--holo-pink), var(--holo-cyan), var(--holo-blue));
      opacity: 0.5;
    }
    .diary-stamp .day { font-size: 19px; font-weight: 700; line-height: 1; }
    .diary-stamp .month { font-size: 9px; letter-spacing: 1px; opacity: 0.85; }
    .diary-rail-line {
      width: 2px; flex: 1; margin-top: 8px;
      background: repeating-linear-gradient(180deg, var(--line-strong) 0 8px, transparent 8px 14px);
    }
    .diary-item:last-child .diary-rail-line { display: none; }

    .diary-page {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-soft);
      padding: 18px 22px; margin-bottom: 30px; transition: transform var(--dur) var(--ease), box-shadow var(--dur), border-color var(--dur);
    }
    .diary-page:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--holo-cyan); }
    .diary-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .diary-time { font-size: 11.5px; font-weight: 700; color: var(--ink-faint); font-family: var(--font-mono); }
    .diary-title { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
    .diary-place { font-size: 12.5px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .diary-link { font-size: 11.5px; font-weight: 700; color: var(--holo-cyan); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.5px; }
    .diary-link:hover { color: var(--holo-pink); }

    .schedule-empty { text-align: center; color: var(--ink-soft); padding: 40px 0; font-family: var(--font-mono); }

    @media (max-width: 560px) {
      .diary-item { grid-template-columns: 58px 1fr; gap: 12px; }
      .diary-stamp { width: 54px; height: 54px; }
      .diary-stamp .day { font-size: 15px; }
      .diary-page { padding: 14px 16px; }
    }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>
  <script src="assets/js/fx.js"></script>

  <main class="page-shell">
    <div class="page-title-block" data-pop>
      <span class="sticker sticker-sand"><i class="fas fa-calendar-days"></i> don't miss it</span>
      <h1 class="glitch" data-text="ข่าวสารและตารางงาน">ข่าวสารและตารางงาน</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-blob"></div>
      <div>กำลังโหลดข้อมูล NPT48...</div>
    </div>

    <div id="schedule-view">
      <div class="chip-row" id="filterChips">
        <button class="chip active" data-type="ALL">ทั้งหมด</button>
        <button class="chip" data-type="EVENT">อีเวนต์</button>
        <button class="chip" data-type="MEDIA">สื่อ</button>
        <button class="chip" data-type="LIVE">ไลฟ์</button>
        <button class="chip" data-type="RELEASE">วางจำหน่าย</button>
      </div>
      <div id="schedule-list" class="diary-list pop-in-stagger" data-pop></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var scheduleData = [];
    var currentTypeFilter = 'ALL';

    var TYPE_MAP = {
      EVENT: { sticker: 'sticker-mint', label: 'อีเวนต์' },
      MEDIA: { sticker: 'sticker-sand', label: 'สื่อ' },
      LIVE: { sticker: 'sticker-lavender', label: 'ไลฟ์' },
      RELEASE: { sticker: 'sticker-navy', label: 'วางจำหน่าย' }
    };

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML =
          'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Schedule')
        .then(function (data) {
          if (!Array.isArray(data)) throw new Error((data && data.error) || 'Invalid schedule data');
          scheduleData = data.slice().sort(function (a, b) {
            return parseDate(a.date).sortKey - parseDate(b.date).sortKey;
          });
          renderList('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('schedule-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง';
        });
    }

    document.getElementById('filterChips').querySelectorAll('.chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#filterChips .chip').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTypeFilter = btn.getAttribute('data-type');
        renderList(currentTypeFilter);
      });
    });

    function parseDate(raw) {
      var d = new Date(raw);
      if (isNaN(d.getTime())) {
        return { day: String(raw || '-'), month: '', sortKey: 0 };
      }
      var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      return { day: d.getDate(), month: months[d.getMonth()], sortKey: d.getTime() };
    }

    function renderList(type) {
      var list = document.getElementById('schedule-list');
      var filtered = type === 'ALL' ? scheduleData : scheduleData.filter(function (s) {
        return (s.type || '').toString().toUpperCase() === type;
      });

      if (!filtered.length) {
        list.innerHTML = '<p class="schedule-empty">ยังไม่มีตารางงานในตอนนี้</p>';
        return;
      }

      list.innerHTML = filtered.map(function (s) {
        var typeKey = (s.type || '').toString().toUpperCase();
        var meta = TYPE_MAP[typeKey] || { sticker: 'sticker-sky', label: s.type || '' };
        var d = parseDate(s.date);
        var place = s.place ? '<div class="diary-place"><i class="fas fa-location-dot"></i>' + s.place + '</div>' : '';
        var link = s.link ? '<a href="' + s.link + '" target="_blank" class="diary-link">รายละเอียด <i class="fas fa-arrow-right"></i></a>' : '';
        return '' +
          '<div class="diary-item">' +
            '<div class="diary-rail"><div class="diary-stamp"><span class="day">' + d.day + '</span><span class="month">' + d.month + '</span></div><div class="diary-rail-line"></div></div>' +
            '<div class="diary-page">' +
              '<div class="diary-meta"><span class="sticker ' + meta.sticker + '">' + meta.label + '</span><span class="diary-time">' + (s.time || '') + '</span></div>' +
              '<h3 class="diary-title">' + s.title + '</h3>' +
              place +
              link +
            '</div>' +
          '</div>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
