<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1240">
  <title>NPT48 Official Site — Profile</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=K2D:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    // Motion preference: saved toggle choice wins, else follow the OS reduced-motion setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('npt48_motion'); } catch (e) {}
      var calm = saved ? saved === 'off' : !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (calm) document.documentElement.classList.add('calm');
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main>
    <div class="page-band" aria-hidden="true"></div>

    <div class="page-body wave-top">
      <div class="page-body-inner page-narrow">
        <div class="list-head">
          <h1 class="list-title">PROFILE</h1>
          <label class="select-pill" id="teamFilterWrap">
            <span class="sr-only">Filter by team</span>
            <select id="teamFilter">
              <option value="ALL">ALL</option>
              <option value="N">TEAM N</option>
              <option value="P">TEAM P</option>
              <option value="T">TEAM T</option>
              <option value="Trainee">TRAINEE</option>
            </select>
          </label>
        </div>
        <div id="loading-overlay">
          <div class="spinner-ring"></div>
          <div>Loading NPT48 data...</div>
        </div>

        <div id="main-view">
          <div id="member-grid"></div>
        </div>

        <div id="detail-view">
          <button type="button" class="pill back-btn" onclick="goBack()">‹ BACK</button>
          <div class="detail-layout">
            <div class="detail-photo">
              <div class="pickup-photo"><img id="m-img" alt="Member photo"></div>
            </div>
            <div class="detail-content">
              <div class="info-header">
                <h1 id="m-name-th"></h1>
                <p id="m-name-en"></p>
              </div>
              <div class="info-table" id="m-info-table"></div>
              <div class="social-section" id="m-social"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var ICON_INSTAGRAM = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>';
    var membersData = [];
    var currentMemberName = null;
    var currentTeamFilter = 'ALL';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          membersData = data;
          renderGrid();
          document.getElementById('loading-overlay').style.display = 'none';
          if (!openFromHash()) document.getElementById('main-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'Unable to load data. Please try again later.';
        });
    }

    // Links from the home page arrive as profile#<nickname>
    function openFromHash() {
      var name = decodeURIComponent(window.location.hash.slice(1));
      if (!name) return false;
      return viewDetail(name, true);
    }

    window.addEventListener('hashchange', function () {
      if (!membersData.length) return;
      if (!openFromHash()) showGrid();
    });

    document.getElementById('teamFilter').addEventListener('change', function (e) {
      currentTeamFilter = e.target.value;
      renderGrid();
    });

    // The team dropdown only applies to the grid, so hide it on a member's page.
    function setFilterVisible(show) {
      document.getElementById('teamFilterWrap').style.visibility = show ? '' : 'hidden';
    }

    function memberCardHTML(m, i) {
      var img = window.NPT48_DATA.getDirectImgLink(m.image);
      var badge = m.generation ? '<span class="member-circle-badge">' + esc(String(m.generation).replace(/\s*Generation/i, ' Gen')) + '</span>' : '';
      return '' +
        '<a href="#' + encodeURIComponent(m.name) + '" class="member-circle" data-name="' + esc(m.name) + '" data-pop style="--i:' + (i % 6) + '">' +
          '<div class="member-circle-photo">' + badge + '<img src="' + esc(img) + '" alt="' + esc(m.name) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></div>' +
          '<div class="member-circle-name">' + esc(m.name) + '</div>' +
          '<div class="member-circle-en">' + esc(m.fullNameEN || '') + '</div>' +
        '</a>';
    }

    function renderGrid() {
      var grid = document.getElementById('member-grid');

      if (!membersData.length) {
        grid.innerHTML = '<p class="data-empty">Unable to load data. Please try again later.</p>';
        return;
      }

      var list = currentTeamFilter === 'ALL' ? membersData.slice() : membersData.filter(function (m) {
        return (m.team || '').toString() === currentTeamFilter;
      });
      list.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

      if (!list.length) {
        grid.innerHTML = '<p class="data-empty">No members found.</p>';
        return;
      }

      grid.innerHTML = '<div class="members-grid">' + list.map(memberCardHTML).join('') + '</div>';
      if (window.NPT48_POPIN) window.NPT48_POPIN.init();
    }

    function viewDetail(nickname) {
      var m = membersData.find(function (item) { return item.name === nickname; });
      if (!m) return false;
      currentMemberName = nickname;
      var img = document.getElementById('m-img');
      img.src = window.NPT48_DATA.getDirectImgLink(m.image);
      img.alt = m.name;
      img.onerror = function () { window.NPT48_DATA.imgFallback(img); };
      document.getElementById('m-name-th').innerText = m.fullNameTH || m.name;
      document.getElementById('m-name-en').innerText = m.fullNameEN || '';

      var infoList = [
        { label: 'Nickname', value: m.name },
        { label: 'Generation', value: m.generation },
        { label: 'Team', value: m.team },
        { label: 'Birthday', value: m.birthday },
        { label: 'Oshi Mark', value: m.oshiMark },
        { label: 'Province', value: m.province },
        { label: 'Blood Type', value: m.bloodType },
        { label: 'Likes', value: m.like },
        { label: 'Hobby', value: m.hobby }
      ];

      document.getElementById('m-info-table').innerHTML = infoList.map(function (item) {
        return '<div class="info-row"><div class="info-label">' + item.label.toUpperCase() + '</div><div class="info-value">' + esc(item.value || '-') + '</div></div>';
      }).join('');

      var sHTML = '';
      if (m.instagram && m.instagram !== '-') sHTML += '<a href="' + esc(m.instagram) + '" class="social-link" target="_blank" rel="noopener" aria-label="Instagram">' + ICON_INSTAGRAM + '</a>';
      document.getElementById('m-social').innerHTML = sHTML;

      document.getElementById('main-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      setFilterVisible(false);
      window.scrollTo(0, 0);
      return true;
    }

    function showGrid() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';
      setFilterVisible(true);

      var card = currentMemberName && document.querySelector('.member-circle[data-name="' + CSS.escape(currentMemberName) + '"]');
      if (card) {
        card.scrollIntoView({ block: 'center' });
      } else {
        window.scrollTo(0, 0);
      }
    }

    function goBack() {
      if (window.location.hash) {
        history.pushState(null, '', window.location.pathname + window.location.search);
      }
      showGrid();
    }

    init();
  </script>
  <script src="assets/js/motion.js"></script>
</body>
</html>
