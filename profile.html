<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official Site — Profile</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">The Lineup</span>
      <h1 class="page-hero-title">Profile</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>Loading NPT48 data...</div>
    </div>

    <div id="main-view">
      <div class="filter-tabs" id="teamFilterTabs">
        <button class="tab-btn active" data-team="ALL">All</button>
        <button class="tab-btn" data-team="N">Team N</button>
        <button class="tab-btn" data-team="P">Team P</button>
        <button class="tab-btn" data-team="T">Team T</button>
        <button class="tab-btn" data-team="Trainee">Trainee</button>
      </div>
      <div id="member-grid"></div>
    </div>

    <div id="detail-view">
      <div class="back-btn" onclick="goBack()"><span>Back</span></div>
      <div class="detail-layout">
        <div class="detail-image-box"><img id="m-img" class="detail-image" alt="Member Photo"></div>
        <div class="detail-content">
          <div class="info-header">
            <h1 id="m-name-th"></h1>
            <p id="m-name-en"></p>
          </div>
          <div id="m-info-table"></div>
          <div class="social-section" id="m-social"></div>
        </div>
      </div>
    </div>

  </main>

  <div id="site-footer"></div>

  <script>
    var membersData = [];
    var currentMemberName = null;
    var currentTeamFilter = 'ALL';
    var FACT_MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          membersData = data;
          renderGrid();
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('main-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'Unable to load data. Please try again later.';
        });
    }

    document.getElementById('teamFilterTabs').querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#teamFilterTabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTeamFilter = btn.getAttribute('data-team');
        renderGrid();
      });
    });

    function shortBirthday(raw) {
      var d = new Date(raw);
      if (isNaN(d.getTime())) return '';
      return d.getDate() + ' ' + FACT_MONTH[d.getMonth()];
    }

    function memberCardHTML(m, i) {
      var nameSub = (m.fullNameEN || m.name).toString().toUpperCase();
      var img = window.NPT48_DATA.getDirectImgLink(m.image);
      var socialsHTML = '';
      if (m.instagram && m.instagram !== '-') {
        socialsHTML += '<a href="' + m.instagram + '" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-instagram"></i></a>';
      }
      var facts = [];
      var bday = shortBirthday(m.birthday);
      if (bday) facts.push(bday);
      if (m.province) facts.push(m.province);
      if (m.bloodType) facts.push('Type ' + m.bloodType);
      var factsHTML = facts.length ? ('<div class="member-facts">' + facts.map(function (f) { return '<span>' + f + '</span>'; }).join('') + '</div>') : '';

      return '' +
        '<div class="member-card" data-name="' + m.name + '" data-pop style="--i:' + (i % 8) + '">' +
          '<div class="photo-box" onclick="viewDetail(\'' + m.name + '\')">' +
            '<img src="' + img + '" class="member-photo" alt="' + m.name + '" loading="lazy" onerror="this.src=\'assets/images/logo.png\'">' +
            '<div class="member-overlay"><i class="fas fa-eye"></i></div>' +
          '</div>' +
          '<div class="card-info">' +
            '<div class="card-name-row">' +
              '<div class="member-name-main" onclick="viewDetail(\'' + m.name + '\')">' + m.name + '</div>' +
              '<div class="card-socials">' + socialsHTML + '</div>' +
            '</div>' +
            '<div class="member-name-sub" onclick="viewDetail(\'' + m.name + '\')">' + nameSub + '</div>' +
            factsHTML +
          '</div>' +
        '</div>';
    }

    function renderGrid() {
      var grid = document.getElementById('member-grid');

      if (!membersData.length) {
        grid.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Unable to load data. Please try again later.</p>';
        return;
      }

      var list = currentTeamFilter === 'ALL' ? membersData.slice() : membersData.filter(function (m) {
        return (m.team || '').toString() === currentTeamFilter;
      });
      list.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

      if (!list.length) {
        grid.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">No members found.</p>';
        return;
      }

      var cardsHTML = list.map(function (m, i) { return memberCardHTML(m, i); }).join('');
      grid.innerHTML = '<div class="members-grid">' + cardsHTML + '</div>';

      if (window.NPT48_POPIN) window.NPT48_POPIN.init();
    }

    function viewDetail(nickname) {
      var m = membersData.find(function (item) { return item.name === nickname; });
      if (!m) return;
      currentMemberName = nickname;
      document.getElementById('m-img').src = window.NPT48_DATA.getDirectImgLink(m.image);
      document.getElementById('m-name-th').innerText = m.fullNameTH || m.name;
      document.getElementById('m-name-en').innerText = m.fullNameEN || '';

      var infoList = [
        { label: 'Generation', value: m.generation },
        { label: 'Team', value: m.team },
        { label: 'Birthday', value: m.birthday },
        { label: 'Oshi Mark', value: m.oshiMark },
        { label: 'Province', value: m.province },
        { label: 'Blood Type', value: m.bloodType },
        { label: 'Likes', value: m.like },
        { label: 'Hobby', value: m.hobby }
      ];

      document.getElementById('m-info-table').innerHTML = infoList.map(function (item) {
        return '<div class="info-row"><div class="info-label">' + item.label + '</div><div class="info-value">' + (item.value || '-') + '</div></div>';
      }).join('');

      var sHTML = '';
      if (m.instagram && m.instagram !== '-') sHTML += '<a href="' + m.instagram + '" class="social-link" target="_blank"><i class="fab fa-instagram"></i></a>';
      document.getElementById('m-social').innerHTML = sHTML;

      document.getElementById('main-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';

      var card = currentMemberName && document.querySelector('.member-card[data-name="' + CSS.escape(currentMemberName) + '"]');
      if (card) {
        card.scrollIntoView({ block: 'center' });
      } else {
        window.scrollTo(0, 0);
      }
    }

    init();
  </script>
</body>
</html>
