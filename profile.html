<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official - PROFILE</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Kanit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">The Lineup</span>
      <h1 class="page-hero-title">Profile</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>กำลังโหลดข้อมูล NPT48...</div>
    </div>

    <div id="main-view">
      <div class="filter-tabs" id="filterChips"></div>
      <div id="member-grid" class="members-grid"></div>
    </div>

    <div id="detail-view">
      <div class="back-btn" onclick="goBack()"><span>กลับ</span></div>
      <div class="detail-layout">
        <div class="detail-image-box"><img id="m-img" class="detail-image" alt="Member Photo"></div>
        <div class="detail-content">
          <div class="info-header">
            <h1 id="m-name-th"></h1>
            <p id="m-name-en"></p>
          </div>
          <div id="m-info-table"></div>
          <div class="social-section" id="m-social"></div>
        </div>
      </div>
    </div>

  </main>

  <div id="site-footer"></div>

  <script>
    var membersData = [];
    var currentTeamFilter = 'ALL';
    var currentMemberName = null;

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          membersData = data;
          buildFilterChips();
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('main-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง';
        });
    }

    function buildFilterChips() {
      var teams = [];
      membersData.forEach(function (m) {
        if (m.team && teams.indexOf(m.team) === -1) teams.push(m.team);
      });
      var wrap = document.getElementById('filterChips');
      var html = '<button class="tab-btn active" data-team="ALL">ทั้งหมด</button>';
      teams.forEach(function (team) {
        html += '<button class="tab-btn" data-team="' + team + '">' + team + '</button>';
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          wrap.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentTeamFilter = btn.getAttribute('data-team');
          renderGrid(currentTeamFilter);
        });
      });
    }

    function renderGrid(team) {
      var grid = document.getElementById('member-grid');
      var filtered = team === 'ALL' ? membersData : membersData.filter(function (m) { return m.team === team; });

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft)">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (m) {
        var nameSub = (m.fullNameEN || m.name).toString().toUpperCase();
        var img = window.NPT48_DATA.getDirectImgLink(m.image);
        var socialsHTML = '';
        if (m.instagram && m.instagram !== '-') {
          socialsHTML += '<a href="' + m.instagram + '" class="card-social-link" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-instagram"></i></a>';
        }
        return '' +
          '<div class="member-card" data-name="' + m.name + '">' +
            '<div class="photo-box" onclick="viewDetail(\'' + m.name + '\')">' +
              '<img src="' + img + '" class="member-photo" alt="' + m.name + '" loading="lazy" onerror="this.src=\'assets/images/logo.png\'">' +
            '</div>' +
            '<div class="card-info">' +
              '<div class="card-name-row">' +
                '<div class="member-name-main" onclick="viewDetail(\'' + m.name + '\')">' + m.name + '</div>' +
                '<div class="card-socials">' + socialsHTML + '</div>' +
              '</div>' +
              '<div class="member-name-sub" onclick="viewDetail(\'' + m.name + '\')">' + nameSub + '</div>' +
            '</div>' +
          '</div>';
      }).join('');
    }

    function viewDetail(nickname) {
      var m = membersData.find(function (item) { return item.name === nickname; });
      if (!m) return;
      currentMemberName = nickname;
      document.getElementById('m-img').src = window.NPT48_DATA.getDirectImgLink(m.image);
      document.getElementById('m-name-th').innerText = m.fullNameTH || m.name;
      document.getElementById('m-name-en').innerText = m.fullNameEN || '';

      var infoList = [
        { label: 'รุ่น', value: m.generation },
        { label: 'ทีม', value: m.team },
        { label: 'วันเกิด', value: m.birthday },
        { label: 'โอชิมาร์ค', value: m.oshiMark },
        { label: 'จังหวัด', value: m.province },
        { label: 'กรุ๊ปเลือด', value: m.bloodType },
        { label: 'สิ่งที่ชอบ', value: m.like },
        { label: 'งานอดิเรก', value: m.hobby }
      ];

      document.getElementById('m-info-table').innerHTML = infoList.map(function (item) {
        return '<div class="info-row"><div class="info-label">' + item.label + '</div><div class="info-value">' + (item.value || '-') + '</div></div>';
      }).join('');

      var sHTML = '';
      if (m.instagram && m.instagram !== '-') sHTML += '<a href="' + m.instagram + '" class="social-link" target="_blank"><i class="fab fa-instagram"></i></a>';
      document.getElementById('m-social').innerHTML = sHTML;

      document.getElementById('main-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('main-view').style.display = 'block';

      var card = currentMemberName && document.querySelector('.member-card[data-name="' + CSS.escape(currentMemberName) + '"]');
      if (card) {
        card.scrollIntoView({ block: 'center' });
      } else {
        window.scrollTo(0, 0);
      }
    }

    init();
  </script>
</body>
</html>
