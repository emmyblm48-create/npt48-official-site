<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>PROFILE | NPT48 OFFICIAL SITE</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main>
    <div class="content page-title">
      <h1 class="subtitle" data-pop>PROFILE</h1>

      <!-- Group view: key visual -->
      <div id="main-view" class="group-photo">
        <img src="https://lh3.googleusercontent.com/d/16h5s_zmCcpfUp12RwzNzeFYnjnp109RK=s2000" alt="NPT48" onerror="NPT48_DATA.imgFallback(this)">
      </div>

      <!-- Member view -->
      <div id="detail-view" class="member-detail" hidden>
        <div class="member-detail-photo"><img id="m-img" src="assets/images/logo.png" alt=""></div>
        <h2 id="m-name"></h2>
        <p class="names" id="m-names"></p>
        <div id="m-social"></div>
        <dl class="info-grid" id="m-info"></dl>
      </div>
    </div>

    <div class="logo-block"><img src="assets/images/logo.png" alt="NPT48" width="500" height="500"></div>

    <!-- Member list -->
    <section class="section section--blue" id="members">
      <div class="content">
        <div class="tabs" id="teamTabs" role="tablist" aria-label="Filter by team">
          <button type="button" data-team="ALL" class="active">ALL</button>
          <button type="button" data-team="N">TEAM N</button>
          <button type="button" data-team="P">TEAM P</button>
          <button type="button" data-team="T">TEAM T</button>
          <button type="button" data-team="Trainee">TRAINEE</button>
        </div>
        <div id="loading-overlay" style="color:#fff">
          <div class="spinner-ring"></div>
          <div>Loading NPT48 data...</div>
        </div>
        <div class="member-grid" id="member-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    var ICON_INSTAGRAM = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>';
    var membersData = [];
    var currentMemberName = null;
    var currentTeamFilter = 'ALL';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          membersData = data;
          document.getElementById('loading-overlay').style.display = 'none';
          renderGrid();
          openFromHash();
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'Unable to load data. Please try again later.';
        });
    }

    // Members open as profile#<nickname> (from the grid below or the home page)
    function openFromHash() {
      var name = decodeURIComponent(window.location.hash.slice(1));
      if (!name || !viewDetail(name)) showGroup();
    }

    window.addEventListener('hashchange', function () {
      if (membersData.length) { openFromHash(); window.scrollTo(0, 0); }
    });

    document.getElementById('teamTabs').addEventListener('click', function (e) {
      var b = e.target.closest('[data-team]');
      if (!b) return;
      currentTeamFilter = b.getAttribute('data-team');
      this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('active', x === b); });
      renderGrid();
    });

    function renderGrid() {
      var grid = document.getElementById('member-grid');
      if (!membersData.length) {
        grid.innerHTML = '<p class="data-empty">Unable to load data. Please try again later.</p>';
        return;
      }

      var list = currentTeamFilter === 'ALL' ? membersData.slice() : membersData.filter(function (m) {
        return (m.team || '').toString() === currentTeamFilter;
      });
      list.sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); });

      if (!list.length) {
        grid.innerHTML = '<p class="data-empty" style="grid-column:1/-1;background:var(--blue)">No members found.</p>';
        return;
      }

      grid.innerHTML = list.map(function (m) {
        var img = window.NPT48_DATA.getDirectImgLink(m.image);
        var badge = m.generation ? '<span class="member-badge">' + esc(String(m.generation).replace(/\s*Generation/i, ' Gen')) + '</span>' : '';
        return '' +
          '<a href="#' + encodeURIComponent(m.name) + '" class="member-tile' + (m.name === currentMemberName ? ' active' : '') + '" data-name="' + esc(m.name) + '">' +
            badge +
            '<div class="member-photo"><img src="' + esc(img) + '" alt="' + esc(m.name) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></div>' +
            '<div class="member-name">' + esc(String(m.name).toUpperCase()) + '</div>' +
          '</a>';
      }).join('');
    }

    function markActive() {
      document.querySelectorAll('.member-grid .member-tile').forEach(function (t) {
        t.classList.toggle('active', t.getAttribute('data-name') === currentMemberName);
      });
    }

    function viewDetail(nickname) {
      var m = membersData.find(function (item) { return item.name === nickname; });
      if (!m) return false;
      currentMemberName = nickname;
      var img = document.getElementById('m-img');
      img.src = window.NPT48_DATA.getDirectImgLink(m.image);
      img.alt = m.name;
      img.onerror = function () { window.NPT48_DATA.imgFallback(img); };
      document.getElementById('m-name').textContent = String(m.name).toUpperCase();
      // The sheet's "fullNameTH" column holds the romanised name and "fullNameEN" the Thai one
      document.getElementById('m-names').textContent = [m.fullNameTH, m.fullNameEN].filter(Boolean).join(' / ');

      var infoList = [
        ['BIRTHDAY', m.birthday],
        ['GENERATION', m.generation],
        ['TEAM', m.team],
        ['OSHI MARK', m.oshiMark],
        ['PROVINCE', m.province],
        ['BLOOD TYPE', m.bloodType],
        ['LIKES', m.like, true],
        ['HOBBY', m.hobby, true]
      ];
      document.getElementById('m-info').innerHTML = infoList.map(function (it) {
        return '<div' + (it[2] ? ' class="wide"' : '') + '><dt>' + it[0] + '</dt><dd>' + esc(it[1] || '-') + '</dd></div>';
      }).join('');

      document.getElementById('m-social').innerHTML = (m.instagram && m.instagram !== '-')
        ? '<a href="' + esc(m.instagram) + '" class="ig-link" target="_blank" rel="noopener">' + ICON_INSTAGRAM + 'INSTAGRAM</a>'
        : '';

      document.title = String(m.name).toUpperCase() + ' | PROFILE | NPT48 OFFICIAL SITE';
      document.getElementById('main-view').hidden = true;
      document.getElementById('detail-view').hidden = false;
      markActive();
      return true;
    }

    function showGroup() {
      currentMemberName = null;
      document.title = 'PROFILE | NPT48 OFFICIAL SITE';
      document.getElementById('detail-view').hidden = true;
      document.getElementById('main-view').hidden = false;
      markActive();
    }

    init();
  </script>
</body>
</html>
