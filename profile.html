<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPT48 Official - PROFILE</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@500;600;700&family=Kanit:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    #grid-view { display: none; }
    .member-bento { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 22px; }
    @media (max-width: 1024px) { .member-bento { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) { .member-bento { grid-template-columns: repeat(2, 1fr); gap: 30px 14px; } }

    .member-slot { text-align: center; }
    .member-slot .polaroid { cursor: pointer; }
    .member-slot:nth-child(3n+1) .polaroid { transform: rotate(-3deg); }
    .member-slot:nth-child(3n+2) .polaroid { transform: rotate(2deg); }
    .member-slot:nth-child(3n) .polaroid { transform: rotate(-1deg); }
    .member-slot .polaroid-frame { background: var(--lavender); }
    .member-slot .polaroid-cap { font-size: 18px; }
    .member-slot .slot-sub { font-size: 11px; font-weight: 700; color: var(--ink-faint); letter-spacing: 0.5px; margin-top: 8px; text-transform: uppercase; }
    .member-slot .slot-btn {
      margin-top: 10px; background: var(--lavender); border: none; color: var(--navy-deep); font-family: var(--font-display);
      font-size: 12.5px; font-weight: 600; padding: 8px 20px; cursor: pointer; border-radius: var(--r-pill);
      transition: background var(--dur);
    }
    .member-slot .slot-btn:hover { background: var(--sky); }

    #detail-view { display: none; animation: detailIn 0.4s ease; }
    @keyframes detailIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .back-doodle {
      display: inline-flex; align-items: center; gap: 8px; color: var(--navy-deep); cursor: pointer; font-weight: 700;
      margin-bottom: 26px; font-family: var(--font-display); font-size: 14px; background: none; border: none;
    }
    .back-doodle:hover { text-decoration: underline; }

    .fan-layout { display: flex; gap: 40px; align-items: flex-start; text-align: left; }
    @media (max-width: 760px) { .fan-layout { flex-direction: column; align-items: center; } }
    .fan-photo { flex: 0 0 auto; width: min(320px, 100%); }
    .fan-card .polaroid-frame { aspect-ratio: 3/4; background: var(--lavender); }
    .fan-card { transform: rotate(-2deg); }
    .fan-card .polaroid-cap { font-size: 20px; }

    .fan-sheet { flex: 1; min-width: 260px; }
    #m-name-th { font-family: var(--font-accent); font-size: 40px; color: var(--navy-deep); font-weight: 600; }
    #m-name-en { color: var(--ink-soft); font-size: 14px; font-weight: 700; letter-spacing: 0.5px; margin-top: 2px; }

    .stat-row { display: grid; grid-template-columns: 130px 1fr; padding: 11px 0; border-bottom: 1px dashed var(--line); }
    .stat-label { font-family: var(--font-display); color: var(--ink-faint); font-size: 12.5px; font-weight: 600; }
    .stat-value { color: var(--ink); font-size: 15px; font-weight: 600; }

    .fan-social { display: flex; gap: 10px; margin-top: 22px; }
    .fan-social a {
      width: 40px; height: 40px; border-radius: 50%; background: var(--lavender); color: var(--navy-deep);
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none; transition: all var(--dur);
    }
    .fan-social a:hover { background: var(--sky); transform: translateY(-3px); }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main class="page-shell">
    <div class="page-title-block" data-pop>
      <span class="sticker sticker-sky"><i class="fas fa-users"></i> the members</span>
      <h1>โปรไฟล์สมาชิก</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-blob"></div>
      <div>กำลังโหลดข้อมูล NPT48...</div>
    </div>

    <div id="grid-view">
      <div class="chip-row" id="filterChips"></div>
      <div id="member-grid" class="member-bento pop-in-stagger" data-pop></div>
    </div>

    <div id="detail-view">
      <button type="button" class="back-doodle" onclick="goBack()"><i class="fas fa-arrow-left"></i> กลับไปดูเพื่อนๆ</button>
      <div class="fan-layout">
        <div class="fan-photo">
          <div class="polaroid fan-card">
            <div class="tape tape-tl"></div>
            <div class="polaroid-frame">
              <img id="m-img" style="width:100%;height:100%;object-fit:cover" alt="Member Photo" loading="lazy">
            </div>
            <div class="polaroid-cap font-accent" id="m-cap"></div>
          </div>
        </div>
        <div class="fan-sheet">
          <h1 id="m-name-th"></h1>
          <p id="m-name-en"></p>
          <div id="m-info-table" style="margin-top:20px"></div>
          <div class="fan-social" id="m-social"></div>
        </div>
      </div>
    </div>

  </main>

  <div id="site-footer"></div>

  <script>
    var membersData = [];
    var currentTeamFilter = 'ALL';
    var currentMemberName = null;

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML =
          'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          membersData = data;
          buildFilterChips();
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('grid-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง';
        });
    }

    function buildFilterChips() {
      var teams = [];
      membersData.forEach(function (m) {
        if (m.team && teams.indexOf(m.team) === -1) teams.push(m.team);
      });
      var wrap = document.getElementById('filterChips');
      var html = '<button class="chip active" data-team="ALL">ทั้งหมด</button>';
      teams.forEach(function (team) {
        html += '<button class="chip" data-team="' + team + '">' + team + '</button>';
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll('.chip').forEach(function (btn) {
        btn.addEventListener('click', function () {
          wrap.querySelectorAll('.chip').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentTeamFilter = btn.getAttribute('data-team');
          renderGrid(currentTeamFilter);
        });
      });
    }

    function renderGrid(team) {
      var grid = document.getElementById('member-grid');
      var filtered = team === 'ALL' ? membersData : membersData.filter(function (m) { return m.team === team; });

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft)">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (m) {
        var nameSub = (m.fullNameEN || m.name).toString().toUpperCase();
        var img = window.NPT48_DATA.getDirectImgLink(m.image);
        var altImg = m.imageAlt ? window.NPT48_DATA.getDirectImgLink(m.imageAlt) : img;
        return '' +
          '<div class="member-slot">' +
            '<div class="polaroid" tabindex="0" role="button" aria-label="โปรไฟล์ ' + m.name + '" onclick="viewDetail(\'' + m.name + '\')">' +
              '<div class="polaroid-frame">' +
                '<div class="photo-stack">' +
                  '<img src="' + img + '" class="photo-base" alt="' + m.name + '" loading="lazy" onerror="this.style.display=\'none\'">' +
                  '<img src="' + altImg + '" class="photo-alt" alt="' + m.name + '" loading="lazy" onerror="this.style.display=\'none\'">' +
                '</div>' +
                '<span class="sparkle-veil"></span>' +
              '</div>' +
              '<div class="polaroid-cap font-accent">' + m.name + '</div>' +
            '</div>' +
            '<div class="slot-sub">' + nameSub + '</div>' +
            '<button class="slot-btn" onclick="viewDetail(\'' + m.name + '\')">ดูโปรไฟล์ <i class="fas fa-star"></i></button>' +
          '</div>';
      }).join('');
    }

    function viewDetail(nickname) {
      var m = membersData.find(function (item) { return item.name === nickname; });
      if (!m) return;
      currentMemberName = nickname;
      document.getElementById('m-img').src = window.NPT48_DATA.getDirectImgLink(m.image);
      document.getElementById('m-cap').innerText = m.name;
      document.getElementById('m-name-th').innerText = m.fullNameTH || m.name;
      document.getElementById('m-name-en').innerText = m.fullNameEN || '';

      var infoList = [
        { label: 'รุ่น', value: m.generation },
        { label: 'ทีม', value: m.team },
        { label: 'วันเกิด', value: m.birthday },
        { label: 'โอชิมาร์ค', value: m.oshiMark },
        { label: 'จังหวัด', value: m.province },
        { label: 'กรุ๊ปเลือด', value: m.bloodType },
        { label: 'สิ่งที่ชอบ', value: m.like },
        { label: 'งานอดิเรก', value: m.hobby }
      ];

      document.getElementById('m-info-table').innerHTML = infoList.map(function (item) {
        return '<div class="stat-row"><div class="stat-label">' + item.label + '</div><div class="stat-value">' + (item.value || '-') + '</div></div>';
      }).join('');

      var sHTML = '';
      if (m.instagram && m.instagram !== '-') sHTML += '<a href="' + m.instagram + '" target="_blank"><i class="fab fa-instagram"></i></a>';
      document.getElementById('m-social').innerHTML = sHTML;

      document.getElementById('grid-view').style.display = 'none';
      document.getElementById('detail-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('grid-view').style.display = 'block';
      window.scrollTo(0, 0);
    }

    document.getElementById('member-grid').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var target = e.target.closest('[role="button"]');
      if (!target) return;
      e.preventDefault();
      target.click();
    });

    init();
  </script>
</body>
</html>
