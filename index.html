<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1240">
  <title>NPT48 Official Site — Home</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=K2D:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    // Motion preference: saved toggle choice wins, else follow the OS reduced-motion setting.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('npt48_motion'); } catch (e) {}
      var calm = saved ? saved === 'off' : !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      if (calm) document.documentElement.classList.add('calm');
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main>
    <!-- HERO -->
    <section class="top-hero">
      <div class="dots" aria-hidden="true">
        <span class="dot dot--yellow" data-depth style="width:48px;height:48px;left:-24px;top:34%;--d:9s;--depth:30"></span>
        <span class="dot dot--ring" data-depth style="width:28px;height:28px;left:25%;top:27%;--d:6s;--depth:18"></span>
        <span class="dot dot--yellow" data-depth style="width:14px;height:14px;left:39.5%;top:33%;--d:7s;--depth:42"></span>
        <span class="dot dot--yellow" data-depth style="width:22px;height:22px;left:49%;top:50%;--d:8s;--depth:26"></span>
        <span class="dot dot--navy" data-depth style="width:48px;height:48px;left:41.5%;top:76%;--d:10s;--depth:34"></span>
        <span class="stripe-ball stripe-ball--white" data-depth style="width:116px;height:116px;left:6%;top:76%;--d:11s;--depth:22"></span>
      </div>
      <span class="scroll-line" aria-hidden="true"></span>

      <div class="hero-copy" data-depth style="--depth:-10">
        <h1 class="hero-wordmark">NPT48<span>Official Site</span></h1>
      </div>

      <div class="hero-visual">
        <div class="pickup-frame" data-depth style="--depth:10">
          <span class="orbit-track" aria-hidden="true"></span>
          <span class="orbit-track orbit-track--gold" aria-hidden="true"></span>
          <div class="pickup-photo"><img id="pickupImg" src="assets/images/logo.png" alt="" fetchpriority="high"></div>
          <a href="discography" class="release-mini" id="releaseMini" hidden>
            <div class="release-mini-inner">
              <div class="release-mini-brand">NPT48</div>
              <div class="release-mini-kicker">Latest Release</div>
              <img id="releaseMiniImg" src="" alt="">
              <div class="release-mini-title" id="releaseMiniTitle"></div>
            </div>
          </a>
          <div class="pickup-badge">
            <span class="pickup-kicker">PICK UP!</span>
            <span class="pickup-name" id="pickupName">NPT48</span>
            <a href="profile" class="pickup-more" id="pickupMore">PROFILE</a>
          </div>
        </div>
        <span class="stripe-ball stripe-ball--navy" data-depth style="--depth:46" aria-hidden="true"></span>
        <span class="stripe-ball stripe-ball--yellow" data-depth style="--depth:60" aria-hidden="true"></span>
      </div>
    </section>

    <!-- BANNER RAIL -->
    <section class="banner-band" id="banner" aria-label="Highlights">
      <div class="rail banner-rail" id="bannerRail">
        <a href="about" class="banner-card banner-card--kv">
          <img src="https://lh3.googleusercontent.com/d/16h5s_zmCcpfUp12RwzNzeFYnjnp109RK=s1000" alt="NPT48 — from the mountains to the sea" decoding="async" onerror="NPT48_DATA.imgFallback(this)">
        </a>
      </div>
    </section>

    <!-- MEMBERS -->
    <section class="section section--white section--full" id="members">
      <div class="section-inner">
        <div class="sec-head" data-pop="left">
          <h2 class="sec-title">Profile<small>สมาชิก NPT48</small></h2>
          <a href="profile" class="view-all">VIEW ALL</a>
        </div>
        <div class="rail-wrap" data-pop>
          <div class="rail" id="membersRail">
            <div class="data-empty">Loading NPT48 data...</div>
          </div>
          <div class="rail-controls">
            <button type="button" class="rail-nav-btn" id="membersPrev" aria-label="Previous members"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
            <button type="button" class="rail-nav-btn" id="membersNext" aria-label="Next members"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
      </div>
    </section>

    <!-- MOVIE -->
    <section class="section section--sky section--full wave-top" id="movie">
      <div class="section-inner">
        <div class="sec-head" data-pop="left">
          <h2 class="sec-title">Movie<small>วิดีโอล่าสุด</small></h2>
          <a href="discography" class="view-all">VIEW ALL</a>
        </div>
        <div class="rail-wrap movie-rail-wrap" data-pop>
          <div class="rail movie-rail" id="movieGrid">
            <div class="data-empty">Loading NPT48 data...</div>
          </div>
          <div class="rail-controls">
            <button type="button" class="rail-nav-btn" id="moviePrev" aria-label="Previous videos"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
            <button type="button" class="rail-nav-btn" id="movieNext" aria-label="Next videos"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <script>
    // Horizontal rail drag-to-scroll (mouse only; touch scrolls natively)
    document.querySelectorAll('.rail').forEach(function (rail) {
      var isDown = false, moved = false, startX, scrollLeft;
      rail.addEventListener('mousedown', function (e) { isDown = true; moved = false; startX = e.pageX; scrollLeft = rail.scrollLeft; rail.style.scrollSnapType = 'none'; });
      window.addEventListener('mouseup', function () { if (!isDown) return; isDown = false; rail.style.scrollSnapType = ''; });
      window.addEventListener('mousemove', function (e) {
        if (!isDown) return;
        var dx = e.pageX - startX;
        if (Math.abs(dx) > 4) moved = true;
        e.preventDefault();
        rail.scrollLeft = scrollLeft - dx;
      });
      // Don't follow a link at the end of a drag
      rail.addEventListener('click', function (e) { if (moved) { e.preventDefault(); moved = false; } }, true);
      rail.addEventListener('dragstart', function (e) { e.preventDefault(); });
    });

    function wireRailNav(railId, prevId, nextId) {
      var rail = document.getElementById(railId);
      var prevBtn = document.getElementById(prevId);
      var nextBtn = document.getElementById(nextId);
      if (!rail || !prevBtn || !nextBtn) return;
      function step() { return rail.clientWidth * 0.8; }
      prevBtn.addEventListener('click', function () { rail.scrollBy({ left: -step(), behavior: 'smooth' }); });
      nextBtn.addEventListener('click', function () { rail.scrollBy({ left: step(), behavior: 'smooth' }); });
    }
    wireRailNav('membersRail', 'membersPrev', 'membersNext');
    wireRailNav('movieGrid', 'moviePrev', 'movieNext');

    var MONTH_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderPickup(members) {
      if (!members.length) return;
      var m = members[Math.floor(Math.random() * members.length)];
      var img = document.getElementById('pickupImg');
      img.src = window.NPT48_DATA.getDirectImgLink(m.image);
      img.alt = m.name;
      img.onerror = function () { window.NPT48_DATA.imgFallback(img); };
      document.getElementById('pickupName').textContent = m.name;
      document.getElementById('pickupMore').href = 'profile#' + encodeURIComponent(m.name);
    }

    function renderMembersRail(members) {
      var rail = document.getElementById('membersRail');
      if (!members.length) {
        rail.innerHTML = '<div class="data-empty">Unable to load data. Please try again later.</div>';
        return;
      }
      rail.innerHTML = members.map(function (m) {
        var img = window.NPT48_DATA.getDirectImgLink(m.image);
        var badge = m.generation ? '<span class="member-circle-badge">' + esc(String(m.generation).replace(/\s*Generation/i, ' Gen')) + '</span>' : '';
        return '' +
          '<a href="profile#' + encodeURIComponent(m.name) + '" class="member-circle">' +
            '<div class="member-circle-photo">' + badge + '<img src="' + esc(img) + '" alt="' + esc(m.name) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></div>' +
            '<div class="member-circle-name">' + esc(m.name) + '</div>' +
            '<div class="member-circle-en">' + esc(m.fullNameEN || '') + '</div>' +
          '</a>';
      }).join('');
    }

    function loadProfileData() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('membersRail').innerHTML = '<div class="data-empty">Google Sheets not connected yet</div>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          renderPickup(data);
          renderMembersRail(data);
        })
        .catch(function () {
          document.getElementById('membersRail').innerHTML = '<div class="data-empty">Unable to load data. Please try again later.</div>';
        });
    }
    loadProfileData();

    function renderReleaseMini(items) {
      if (!items.length) return;
      var latest = items[items.length - 1];
      var card = document.getElementById('releaseMini');
      document.getElementById('releaseMiniImg').onerror = function () { window.NPT48_DATA.imgFallback(this); };
      document.getElementById('releaseMiniImg').src = window.NPT48_DATA.getDirectImgLink(latest.image);
      document.getElementById('releaseMiniImg').alt = latest.songName || '';
      document.getElementById('releaseMiniTitle').textContent = latest.songName || '';
      if (latest.link) { card.href = latest.link; card.target = '_blank'; card.rel = 'noopener'; }
      card.hidden = false;
    }

    function loadReleaseMini() {
      if (!window.NPT48_DATA.isConfigured()) return;
      window.NPT48_DATA.fetchSheet('Discography').then(renderReleaseMini).catch(function () {});
    }
    loadReleaseMini();

    function formatMovieDate(raw) {
      var d = new Date(raw);
      if (isNaN(d.getTime())) return String(raw || '');
      return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
    }

    function renderMovieGrid(items) {
      var grid = document.getElementById('movieGrid');
      if (!items.length) { grid.innerHTML = '<div class="data-empty">No videos yet.</div>'; return; }
      grid.innerHTML = items.slice(0, 8).map(function (d) {
        // The Movie sheet columns (Date, Title Name Song, Description, Link, Img) come back
        // from the Apps Script under generic field names, not their own header text.
        var img = window.NPT48_DATA.getDirectImgLink(d.generation);
        var link = d.fullNameEN || '#';
        var title = d.nameEN || '';
        return '' +
          '<a href="' + esc(link) + '" target="_blank" rel="noopener" class="movie-item">' +
            '<div class="movie-thumb">' +
              '<img src="' + esc(img) + '" alt="' + esc(title) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)">' +
              '<span class="movie-play"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 6.5v11l9-5.5-9-5.5z"/></svg></span>' +
            '</div>' +
            '<div class="movie-title">' + esc(title) + '</div>' +
            '<div class="movie-date">' + esc(formatMovieDate(d.name)) + '</div>' +
          '</a>';
      }).join('');
    }

    // Banner row under the hero: key visual first, then the latest videos
    function renderBannerRail(items) {
      var rail = document.getElementById('bannerRail');
      rail.insertAdjacentHTML('beforeend', items.slice(0, 4).map(function (d) {
        var img = window.NPT48_DATA.getDirectImgLink(d.generation);
        var title = d.nameEN || '';
        return '' +
          '<a href="' + esc(d.fullNameEN || '#') + '" target="_blank" rel="noopener" class="banner-card" title="' + esc(title) + '">' +
            '<img src="' + esc(img) + '" alt="' + esc(title) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)">' +
            '<span class="banner-card-label">MOVIE</span>' +
          '</a>';
      }).join(''));
    }

    function loadMovies() {
      var grid = document.getElementById('movieGrid');
      if (!window.NPT48_DATA.isConfigured()) {
        grid.innerHTML = '<div class="data-empty">Google Sheets not connected yet</div>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Movie')
        .then(function (data) {
          var sorted = data.slice().sort(function (a, b) {
            var da = new Date(a.name).getTime();
            var db = new Date(b.name).getTime();
            if (isNaN(da)) da = 0;
            if (isNaN(db)) db = 0;
            return db - da;
          });
          renderMovieGrid(sorted);
          renderBannerRail(sorted);
        })
        .catch(function () {
          grid.innerHTML = '<div class="data-empty">Unable to load data.</div>';
        });
    }
    loadMovies();
  </script>

  <script src="assets/js/motion.js"></script>
</body>
</html>
