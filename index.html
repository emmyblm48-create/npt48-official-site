<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 OFFICIAL SITE</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main>
    <!-- KEY VISUAL -->
    <div class="hero">
      <img src="https://lh3.googleusercontent.com/d/16h5s_zmCcpfUp12RwzNzeFYnjnp109RK=s2000" alt="NPT48 — from the mountains to the sea" fetchpriority="high" onerror="NPT48_DATA.imgFallback(this)">
    </div>

    <!-- BANNER SLIDER -->
    <div class="slider" id="slider" hidden>
      <div class="slider-track" id="sliderTrack"></div>
      <button type="button" class="slider-arrow slider-arrow--prev" id="sliderPrev" aria-label="Previous">&#8249;</button>
      <button type="button" class="slider-arrow slider-arrow--next" id="sliderNext" aria-label="Next">&#8250;</button>
      <ul class="slider-dots" id="sliderDots"></ul>
    </div>

    <!-- NEWS -->
    <section class="section" id="news">
      <div class="content">
        <h2 class="subtitle" data-pop>NEWS</h2>
        <div class="news-list" id="newsList"><div class="data-empty">Loading NPT48 data...</div></div>
        <button type="button" class="btn-outline" id="newsMore" hidden>MORE</button>
      </div>
    </section>

    <!-- VIDEO -->
    <section class="section section--blue" id="movie">
      <div class="content">
        <h2 class="subtitle" data-pop>VIDEO</h2>
        <div class="video-frame" id="videoFrame"></div>
        <div class="video-now" id="videoNow"></div>
        <div class="rail-wrap movie-rail-wrap">
          <div class="rail movie-rail" id="movieRail"><div class="data-empty">Loading NPT48 data...</div></div>
          <button type="button" class="rail-arrow rail-arrow--prev" id="moviePrev" aria-label="Previous videos">&#8249;</button>
          <button type="button" class="rail-arrow rail-arrow--next" id="movieNext" aria-label="Next videos">&#8250;</button>
        </div>
      </div>
    </section>

    <!-- PROFILE -->
    <section class="section section--blue section--members" id="members">
      <h2 class="subtitle" data-pop>PROFILE</h2>
      <div class="rail-wrap">
        <div class="rail members-rail" id="membersRail"><div class="data-empty">Loading NPT48 data...</div></div>
        <button type="button" class="rail-arrow rail-arrow--prev" id="membersPrev" aria-label="Previous members">&#8249;</button>
        <button type="button" class="rail-arrow rail-arrow--next" id="membersNext" aria-label="Next members">&#8250;</button>
      </div>
      <div class="content"><a href="profile" class="btn-outline">MORE</a></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script>
    var D = window.NPT48_DATA;
    var NEWS_SHOWN = 4;
    var NEW_DAYS = 30;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function parseDate(raw) {
      var parts = (raw || '').toString().split(/[.\-\/]/).map(Number);
      if (parts.length === 3 && parts[0] > 999 && parts.every(function (n) { return !isNaN(n); })) {
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }
      var d = new Date(raw);
      return isNaN(d.getTime()) ? null : d;
    }

    function fmtDate(d) {
      if (!d) return '';
      return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
    }

    function youtubeId(url) {
      var m = String(url || '').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);
      return m ? m[1] : null;
    }

    // ---- Horizontal rails: drag to scroll (mouse; touch scrolls natively) ----
    function wireDrag(rail) {
      var isDown = false, moved = false, startX, scrollLeft;
      rail.addEventListener('mousedown', function (e) { isDown = true; moved = false; startX = e.pageX; scrollLeft = rail.scrollLeft; rail.style.scrollSnapType = 'none'; });
      window.addEventListener('mouseup', function () { if (!isDown) return; isDown = false; rail.style.scrollSnapType = ''; });
      window.addEventListener('mousemove', function (e) {
        if (!isDown) return;
        var dx = e.pageX - startX;
        if (Math.abs(dx) > 4) moved = true;
        e.preventDefault();
        rail.scrollLeft = scrollLeft - dx;
        // A looping rail may have jumped by one set; carry the drag origin with it
        if (rail._loopWrap) scrollLeft += rail._loopWrap();
      });
      // Don't follow a link at the end of a drag
      rail.addEventListener('click', function (e) { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
      rail.addEventListener('dragstart', function (e) { e.preventDefault(); });
    }

    function wireRailNav(rail, prevId, nextId) {
      function step() { return rail.clientWidth * 0.8; }
      document.getElementById(prevId).addEventListener('click', function () { rail.scrollBy({ left: -step(), behavior: 'smooth' }); });
      document.getElementById(nextId).addEventListener('click', function () { rail.scrollBy({ left: step(), behavior: 'smooth' }); });
    }

    // Endless rail: the items are rendered three times (clone · original · clone)
    // and the view starts on the middle copy. Whenever scrolling settles inside a
    // clone, it jumps by exactly one set width to the matching original item, which
    // looks identical, so prev/next, drag and swipe all loop forever.
    function makeLoop(rail) {
      var items = Array.prototype.slice.call(rail.children);
      if (items.length < 2) return;
      function cloneSet() {
        return items.map(function (el) {
          var c = el.cloneNode(true);
          c.setAttribute('aria-hidden', 'true');
          c.setAttribute('tabindex', '-1');
          c.querySelectorAll('a, button').forEach(function (n) { n.setAttribute('tabindex', '-1'); });
          return c;
        });
      }
      cloneSet().forEach(function (c) { rail.insertBefore(c, items[0]); });
      cloneSet().forEach(function (c) { rail.appendChild(c); });

      var after = rail.children[items.length * 2];
      function setWidth() { return after.offsetLeft - items[0].offsetLeft; }
      // Only loop when the items overflow; otherwise the copies would sit in view
      if (setWidth() <= rail.clientWidth) {
        for (var i = 0; i < items.length; i++) { rail.removeChild(rail.firstElementChild); rail.removeChild(rail.lastElementChild); }
        return;
      }
      function jump(dx) {
        rail.style.scrollSnapType = 'none';
        rail.scrollLeft += dx;
        rail.style.scrollSnapType = '';
        return dx;
      }
      rail._loopWrap = function () {
        var w = setWidth(), x = rail.scrollLeft;
        if (x < w * 0.5) return jump(w);
        if (x >= w * 1.5) return jump(-w);
        return 0;
      };
      jump(setWidth() - rail.scrollLeft);
      var timer;
      rail.addEventListener('scroll', function () {
        clearTimeout(timer);
        timer = setTimeout(rail._loopWrap, 140);
      }, { passive: true });
      window.addEventListener('resize', function () { rail._loopWrap(); });
    }

    // ---- VIDEO player ----
    var movies = [];

    function playMovie(i, scroll) {
      var mv = movies[i];
      if (!mv) return;
      var id = youtubeId(mv.link);
      var frame = document.getElementById('videoFrame');
      frame.innerHTML = id
        ? '<iframe src="https://www.youtube-nocookie.com/embed/' + id + (scroll ? '?autoplay=1' : '') + '" title="' + esc(mv.title) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>'
        : '<a href="' + esc(mv.link) + '" target="_blank" rel="noopener"><img src="' + esc(mv.img) + '" alt="' + esc(mv.title) + '" onerror="NPT48_DATA.imgFallback(this)"></a>';
      document.getElementById('videoNow').innerHTML = esc(mv.title) + (mv.desc ? '<small>' + esc(mv.desc) + ' · ' + fmtDate(mv.date) + '</small>' : '');
      document.querySelectorAll('.movie-item').forEach(function (el) {
        el.classList.toggle('is-playing', Number(el.getAttribute('data-i')) === i);
      });
      if (scroll) document.getElementById('movie').scrollIntoView({ behavior: 'smooth' });
    }

    // Any link marked data-movie plays that video in the VIDEO section instead of leaving the page
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-movie]');
      if (!a || e.defaultPrevented) return;
      e.preventDefault();
      playMovie(Number(a.getAttribute('data-movie')), true);
    });

    function renderMovies() {
      var rail = document.getElementById('movieRail');
      if (!movies.length) { rail.innerHTML = '<div class="data-empty">No videos yet.</div>'; return; }
      rail.innerHTML = movies.map(function (mv, i) {
        return '' +
          '<a href="' + esc(mv.link) + '" class="movie-item" data-movie="' + i + '" data-i="' + i + '">' +
            '<div class="movie-thumb"><img src="' + esc(mv.img) + '" alt="' + esc(mv.title) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></div>' +
            '<div class="movie-title">' + esc(mv.title) + '</div>' +
            '<div class="movie-date">' + fmtDate(mv.date) + '</div>' +
          '</a>';
      }).join('');
      playMovie(0, false);
      makeLoop(rail);
    }

    // ---- Banner slider (latest videos) ----
    function renderSlider() {
      var list = movies.slice(0, 5);
      if (!list.length) return;
      var track = document.getElementById('sliderTrack');
      var dots = document.getElementById('sliderDots');
      track.innerHTML = list.map(function (mv, i) {
        return '<a href="' + esc(mv.link) + '" class="banner-card" data-movie="' + i + '" title="' + esc(mv.title) + '"><img src="' + esc(mv.img) + '" alt="' + esc(mv.title) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></a>';
      }).join('');
      dots.innerHTML = list.map(function (mv, i) {
        return '<li><button type="button" aria-label="Slide ' + (i + 1) + '" data-slide="' + i + '"></button></li>';
      }).join('');
      document.getElementById('slider').hidden = false;

      var cards = track.children;
      function goTo(i) {
        i = (i + cards.length) % cards.length;
        var c = cards[i];
        track.scrollTo({ left: c.offsetLeft - (track.clientWidth - c.offsetWidth) / 2, behavior: 'smooth' });
      }
      function current() {
        var mid = track.scrollLeft + track.clientWidth / 2, best = 0, bestD = Infinity;
        for (var i = 0; i < cards.length; i++) {
          var d = Math.abs(cards[i].offsetLeft + cards[i].offsetWidth / 2 - mid);
          if (d < bestD) { bestD = d; best = i; }
        }
        return best;
      }
      function markDot() {
        var cur = current();
        dots.querySelectorAll('button').forEach(function (b, i) { b.classList.toggle('active', i === cur); });
      }
      dots.addEventListener('click', function (e) {
        var b = e.target.closest('[data-slide]');
        if (b) goTo(Number(b.getAttribute('data-slide')));
      });
      document.getElementById('sliderPrev').addEventListener('click', function () { goTo(current() - 1); });
      document.getElementById('sliderNext').addEventListener('click', function () { goTo(current() + 1); });
      track.addEventListener('scroll', function () { window.requestAnimationFrame(markDot); }, { passive: true });
      markDot();

      // Auto-advance like a carousel; pause while hovered
      var hover = false;
      document.getElementById('slider').addEventListener('mouseenter', function () { hover = true; });
      document.getElementById('slider').addEventListener('mouseleave', function () { hover = false; });
      setInterval(function () { if (!hover && !document.hidden) goTo(current() + 1); }, 5000);
    }

    // ---- NEWS (latest videos + releases, newest first) ----
    var newsItems = [];
    var newsLoads = 0;

    function renderNews() {
      var list = document.getElementById('newsList');
      if (!newsItems.length) {
        list.innerHTML = '<div class="data-empty">' + (newsLoads < 2 ? 'Loading NPT48 data...' : 'No news yet.') + '</div>';
        return;
      }
      newsItems.sort(function (a, b) { return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0); });
      var now = Date.now();
      list.innerHTML = newsItems.map(function (n, i) {
        var isNew = n.date && now - n.date.getTime() < NEW_DAYS * 864e5 && n.date.getTime() <= now;
        return '' +
          '<a href="' + esc(n.href) + '" class="news-item"' + (n.movie != null ? ' data-movie="' + n.movie + '"' : '') + (i >= NEWS_SHOWN ? ' hidden' : '') + '>' +
            '<span class="news-meta">' + fmtDate(n.date) + '<span class="sep">|</span>' + n.cat + (isNew ? '<span class="news-new">NEW</span>' : '') + '</span>' +
            '<span class="news-title">' + esc(n.title) + '</span>' +
          '</a>';
      }).join('');
      document.getElementById('newsMore').hidden = newsItems.length <= NEWS_SHOWN;
    }

    document.getElementById('newsMore').addEventListener('click', function () {
      document.querySelectorAll('.news-item[hidden]').forEach(function (el) { el.hidden = false; });
      this.hidden = true;
    });

    // ---- PROFILE rail ----
    function renderMembers(members) {
      var rail = document.getElementById('membersRail');
      if (!members.length) { rail.innerHTML = '<div class="data-empty">Unable to load data. Please try again later.</div>'; return; }
      rail.innerHTML = members.map(function (m) {
        return '' +
          '<a href="profile#' + encodeURIComponent(m.name) + '" class="member-tile">' +
            '<div class="member-photo"><img src="' + esc(D.getDirectImgLink(m.image)) + '" alt="' + esc(m.name) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></div>' +
            '<div class="member-name">' + esc(String(m.name).toUpperCase()) + '</div>' +
          '</a>';
      }).join('');
      makeLoop(rail);
    }

    ['movieRail', 'membersRail'].forEach(function (id) { wireDrag(document.getElementById(id)); });
    wireRailNav(document.getElementById('movieRail'), 'moviePrev', 'movieNext');
    wireRailNav(document.getElementById('membersRail'), 'membersPrev', 'membersNext');

    function fail(id) {
      return function () { document.getElementById(id).innerHTML = '<div class="data-empty">Unable to load data. Please try again later.</div>'; };
    }

    if (!D.isConfigured()) {
      ['newsList', 'movieRail', 'membersRail'].forEach(function (id) { document.getElementById(id).innerHTML = '<div class="data-empty">Google Sheets not connected yet</div>'; });
    } else {
      D.fetchSheet('Profile').then(renderMembers).catch(fail('membersRail'));

      // The Movie sheet columns (Date, Title Name Song, Description, Link, Img) come back
      // from the Apps Script under generic field names, not their own header text.
      D.fetchSheet('Movie').then(function (data) {
        movies = data.map(function (d) {
          return { date: parseDate(d.name), title: d.nameEN || '', desc: d.fullNameTH || '', link: d.fullNameEN || '#', img: D.getDirectImgLink(d.generation) };
        }).sort(function (a, b) { return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0); });
        renderMovies();
        renderSlider();
        movies.forEach(function (mv, i) {
          newsItems.push({ date: mv.date, cat: 'MOVIE', title: mv.title + (mv.desc ? ' (' + mv.desc + ')' : ''), href: mv.link, movie: i });
        });
      }).catch(fail('movieRail')).then(function () { newsLoads++; renderNews(); });

      D.fetchSheet('Discography').then(function (data) {
        data.forEach(function (d) {
          newsItems.push({ date: parseDate(d.release), cat: 'RELEASE', title: d.songName, href: 'discography#' + encodeURIComponent(d.songName) });
        });
      }).catch(function () {}).then(function () { newsLoads++; renderNews(); });
    }
  </script>
</body>
</html>
