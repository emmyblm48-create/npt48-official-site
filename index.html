<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official Site — Home</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400|K2D:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <!-- INTRO LOADER -->
  <div id="siteLoader" class="site-loader">
    <div class="loader-bubbles" id="loaderBubbles"></div>
    <div class="loader-brand">
      <img class="loader-logo" src="assets/images/logo.png" alt="NPT48" width="500" height="500">
      <div class="loader-tagline">Official Site</div>
    </div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('siteLoader');
      if (!loader) return;

      var bubbleColors = ['#0d5bb5', '#1e88e5', '#6fc3f7', '#ffffff', '#0f2942'];
      var bubbleWrap = document.getElementById('loaderBubbles');
      for (var i = 0; i < 18; i++) {
        var b = document.createElement('span');
        b.className = 'loader-bubble';
        var size = 10 + Math.random() * 60;
        var color = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
        b.style.left = (Math.random() * 100) + '%';
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.background = color;
        if (color === '#ffffff') b.style.border = '2px solid rgba(13, 91, 181, 0.25)';
        b.style.setProperty('--drift', (20 + Math.random() * 50) + 'px');
        b.style.setProperty('--dur', (3 + Math.random() * 5) + 's');
        b.style.animationDelay = (Math.random() * 6) + 's';
        bubbleWrap.appendChild(b);
      }

      document.body.style.overflow = 'hidden';

      setTimeout(function () {
        loader.classList.add('is-hidden');
        document.body.style.overflow = '';
        setTimeout(function () { loader.remove(); }, 400);
      }, 2600);
    })();
  </script>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <!-- HERO -->
  <section class="hero">
    <img src="https://lh3.googleusercontent.com/d/16h5s_zmCcpfUp12RwzNzeFYnjnp109RK=s1000" alt="NPT48 — from the mountains to the sea" fetchpriority="high" decoding="async">
  </section>

  <!-- BENTO STRIP: Birthday + Spotlight -->
  <div class="bento-row">
    <div class="bento-card" data-pop>
      <div class="bento-card-head">
        <span class="eyebrow">Birthday This Month</span>
        <span class="data-date" id="birthdayMonthLabel"></span>
      </div>
      <div class="bday-list" id="birthdayList">
        <div class="bday-empty">...</div>
      </div>
      <a href="profile" class="arrow-link">View All Members</a>
    </div>
    <div class="bento-card" data-pop style="--i:1">
      <span class="eyebrow">Latest Release</span>
      <div id="spotlightCard" style="margin-top:20px">
        <div class="bday-empty">...</div>
      </div>
    </div>
  </div>

  <!-- MEMBERS -->
  <section class="members-section" data-pop>
    <div class="sec-head no-underline">
      <h2 class="sec-title">Members</h2>
      <a href="profile" class="arrow-link">View All Members</a>
    </div>
    <div class="rail-wrap">
      <div class="rail" id="membersRail">
        <div class="bday-empty">Loading NPT48 data...</div>
      </div>
      <button type="button" class="rail-nav-btn rail-nav-prev" id="membersPrev" aria-label="Previous members"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button type="button" class="rail-nav-btn rail-nav-next" id="membersNext" aria-label="Next members"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- MOVIE -->
  <section class="video-section" data-pop>
    <div class="sec-head no-underline">
      <h2 class="sec-title">Movie</h2>
      <a href="discography" class="arrow-link">View All Releases</a>
    </div>

    <div class="movie-grid" id="movieGrid">
      <div class="data-empty">Loading NPT48 data...</div>
    </div>
  </section>

  <!-- GROUP NETWORK -->
  <div class="group-band" data-pop>
    <div class="group-inner">
      <div class="group-divider"><hr><span>AKB48 Group</span><hr></div>
      <div class="logo-grid">
        <a href="https://www.akb48.co.jp/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_akb48.png?ver=53" alt="AKB48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://www.ske48.co.jp/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_ske48.png?ver=53" alt="SKE48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://nmb48.com/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_nmb48.png?ver=53" alt="NMB48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="http://www.hkt48.jp/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_hkt48.png?ver=53" alt="HKT48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://ngt48.jp/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_ngt48.png?ver=53" alt="NGT48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://www.stu48.com/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_stu48.png?ver=53" alt="STU48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://www.jkt48.com/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_jkt48.png?ver=53" alt="JKT48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://www.bnk48.com/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_bnk48.png?ver=53" alt="BNK48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://weibo.com/akb48teamsh" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_tsh48.png?ver=53" alt="TSH48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://www.tpe48.tw/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_tpe48.png" alt="TPE48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://www.cgm48official.com/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_cgm48.png?ver=53" alt="CGM48" width="100" height="140" loading="lazy" decoding="async"></a>
        <a href="https://klp48.my/" target="_blank"><img src="https://s.akb48.co.jp/v2/index/img/g_klp48.png?ver=53" alt="KLP48" width="100" height="140" loading="lazy" decoding="async"></a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div id="site-footer"></div>

  <script>
    // Horizontal rail drag-to-scroll
    document.querySelectorAll('.rail').forEach(function (rail) {
      var isDown = false, startX, scrollLeft;
      rail.addEventListener('mousedown', function (e) { isDown = true; rail.style.cursor = 'grabbing'; startX = e.pageX - rail.offsetLeft; scrollLeft = rail.scrollLeft; });
      window.addEventListener('mouseup', function () { isDown = false; rail.style.cursor = 'grab'; });
      window.addEventListener('mousemove', function (e) {
        if (!isDown) return;
        e.preventDefault();
        var x = e.pageX - rail.offsetLeft;
        rail.scrollLeft = scrollLeft - (x - startX);
      });
    });

    // Rail prev/next scroll buttons
    function wireRailNav(railId, prevId, nextId, itemSelector) {
      var rail = document.getElementById(railId);
      var prevBtn = document.getElementById(prevId);
      var nextBtn = document.getElementById(nextId);
      if (!rail || !prevBtn || !nextBtn) return;
      function step() {
        var item = rail.querySelector(itemSelector);
        var gap = parseFloat(getComputedStyle(rail).columnGap || getComputedStyle(rail).gap || 16);
        var itemWidth = item ? item.getBoundingClientRect().width : rail.clientWidth * 0.4;
        return (itemWidth + gap) * 2;
      }
      prevBtn.addEventListener('click', function () { rail.scrollBy({ left: -step(), behavior: 'smooth' }); });
      nextBtn.addEventListener('click', function () { rail.scrollBy({ left: step(), behavior: 'smooth' }); });
    }
    wireRailNav('membersRail', 'membersPrev', 'membersNext', '.member-mini');

    var MONTH_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function renderBirthdayMonth(members) {
      var today = new Date();
      var monthLabelEl = document.getElementById('birthdayMonthLabel');
      if (monthLabelEl) monthLabelEl.textContent = MONTH_EN[today.getMonth()] + ' ' + today.getFullYear();

      var listEl = document.getElementById('birthdayList');
      if (!listEl) return;

      var celebrants = members.map(function (m) {
        var bday = m.birthday ? new Date(m.birthday) : null;
        return (bday && !isNaN(bday.getTime())) ? { member: m, bday: bday } : null;
      }).filter(function (e) { return e && e.bday.getMonth() === today.getMonth(); })
        .sort(function (a, b) { return a.bday.getDate() - b.bday.getDate(); });

      if (!celebrants.length) {
        listEl.innerHTML = '<div class="bday-empty">No member birthdays this month.</div>';
        return;
      }

      listEl.innerHTML = celebrants.map(function (c) {
        var img = window.NPT48_DATA.getDirectImgLink(c.member.image);
        return '' +
          '<a href="profile" class="bday-item">' +
            '<div class="bday-avatar"><img src="' + img + '" alt="' + c.member.name + '" decoding="async" onerror="this.src=\'assets/images/logo.png\'"></div>' +
            '<div class="bday-info"><span class="bday-name">' + c.member.name + '</span><span class="bday-date">' + c.bday.getDate() + ' ' + MONTH_EN[c.bday.getMonth()] + '</span></div>' +
          '</a>';
      }).join('');
    }

    function renderMembersRail(members) {
      var rail = document.getElementById('membersRail');
      if (!members.length) {
        rail.innerHTML = '<div class="bday-empty">Unable to load data. Please try again later.</div>';
        return;
      }
      rail.innerHTML = members.map(function (m) {
        var img = window.NPT48_DATA.getDirectImgLink(m.image);
        var badge = m.generation ? '<span class="member-mini-badge">' + m.generation + '</span>' : '';
        return '' +
          '<a href="profile" class="member-mini">' +
            '<div class="member-mini-photo">' + badge + '<img src="' + img + '" alt="' + m.name + '" loading="lazy" decoding="async" onerror="this.src=\'assets/images/logo.png\'"></div>' +
            '<div class="member-mini-name">' + m.name + '</div>' +
          '</a>';
      }).join('');
    }

    function loadProfileData() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('birthdayList').innerHTML = '<div class="bday-empty">Google Sheets not connected yet</div>';
        document.getElementById('membersRail').innerHTML = '<div class="bday-empty">Google Sheets not connected yet</div>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Profile')
        .then(function (data) {
          renderBirthdayMonth(data);
          renderMembersRail(data);
        })
        .catch(function () {
          document.getElementById('birthdayList').innerHTML = '<div class="bday-empty">Unable to load data.</div>';
          document.getElementById('membersRail').innerHTML = '<div class="bday-empty">Unable to load data. Please try again later.</div>';
        });
    }
    loadProfileData();

    function renderSpotlight(items) {
      var card = document.getElementById('spotlightCard');
      if (!items.length) { card.innerHTML = '<div class="bday-empty">No releases yet.</div>'; return; }
      var latest = items[items.length - 1];
      var img = window.NPT48_DATA.getDirectImgLink(latest.image);
      var link = latest.link || '#';
      var isAlbum = (latest.type || '').toString().toUpperCase() === 'ALBUM';
      card.innerHTML = '' +
        '<a href="' + link + '" target="_blank" class="spot-card">' +
          '<div class="spot-thumb"><img src="' + img + '" alt="' + latest.songName + '" decoding="async"></div>' +
          '<div>' +
            '<div class="kicker kicker-gold">' + (isAlbum ? 'Album' : 'Single') + '</div>' +
            '<div class="spot-title">' + latest.songName + '</div>' +
            '<span class="arrow-link">Watch MV</span>' +
          '</div>' +
        '</a>';
    }

    function loadSpotlight() {
      var spot = document.getElementById('spotlightCard');
      if (!window.NPT48_DATA.isConfigured()) {
        spot.innerHTML = '<div class="bday-empty">Google Sheets not connected yet</div>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(renderSpotlight)
        .catch(function () {
          spot.innerHTML = '<div class="bday-empty">Unable to load data.</div>';
        });
    }
    loadSpotlight();

    function formatMovieDate(raw) {
      var d = new Date(raw);
      if (isNaN(d.getTime())) return String(raw || '');
      return d.getDate() + ' ' + MONTH_EN[d.getMonth()] + ' ' + d.getFullYear();
    }

    function renderMovieGrid(items) {
      var grid = document.getElementById('movieGrid');
      if (!items.length) { grid.innerHTML = '<div class="data-empty">No releases yet.</div>'; return; }
      grid.innerHTML = items.slice(0, 4).map(function (d, i) {
        // The Movie sheet columns (Date, Title Name Song, Description, Link, Img) come back
        // from the Apps Script under generic field names, not their own header text.
        var img = window.NPT48_DATA.getDirectImgLink(d.generation);
        var link = d.fullNameEN || '#';
        var title = d.nameEN || '';
        var tooltip = (title + ' — ' + formatMovieDate(d.name)).replace(/"/g, '&quot;');
        return '' +
          '<a href="' + link + '" target="_blank" class="movie-item" data-pop style="--i:' + i + '" title="' + tooltip + '">' +
            '<img src="' + img + '" alt="' + title + '" loading="lazy" decoding="async">' +
            '<span class="movie-play-btn"><svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 6.5v11l9-5.5-9-5.5z"/></svg></span>' +
          '</a>';
      }).join('');
      if (window.NPT48_POPIN) window.NPT48_POPIN.init();
    }

    function loadMovies() {
      var grid = document.getElementById('movieGrid');
      if (!window.NPT48_DATA.isConfigured()) {
        grid.innerHTML = '<div class="data-empty">Google Sheets not connected yet</div>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Movie')
        .then(function (data) {
          var sorted = data.slice().sort(function (a, b) {
            var da = new Date(a.name).getTime();
            var db = new Date(b.name).getTime();
            if (isNaN(da)) da = 0;
            if (isNaN(db)) db = 0;
            return db - da;
          });
          renderMovieGrid(sorted);
        })
        .catch(function () {
          grid.innerHTML = '<div class="data-empty">Unable to load data.</div>';
        });
    }
    loadMovies();
  </script>

</body>
</html>
