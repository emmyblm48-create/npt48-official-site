<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPT48 Official - DISCOGRAPHY</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@500;600;700&family=Kanit:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    #disco-view { display: none; }
    .record-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 34px 24px; }
    @media (max-width: 1024px) { .record-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) { .record-grid { grid-template-columns: repeat(2, 1fr); gap: 26px 16px; } }

    .record-item { text-align: center; }
    .record-link { text-decoration: none; color: inherit; display: block; }

    .record-disc {
      position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 50%; overflow: hidden;
      background: var(--lavender); box-shadow: var(--shadow-soft); border: 7px solid var(--white);
      outline: 2px solid var(--line); margin-bottom: 14px; transition: transform 0.7s var(--ease), box-shadow var(--dur);
    }
    .record-disc::after {
      content: ''; position: absolute; inset: 0; margin: auto; width: 20%; height: 20%; border-radius: 50%;
      background: var(--cream); border: 2px solid var(--white); z-index: 2;
    }
    .record-disc img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .record-item:hover .record-disc { transform: rotate(70deg); box-shadow: var(--shadow-hover); }

    .play-sticker {
      position: absolute; bottom: 6%; right: 6%; z-index: 3; background: var(--butter-deep); color: var(--navy-deep);
      width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; box-shadow: var(--shadow-tape); opacity: 0; transition: opacity var(--dur);
    }
    .record-item:hover .play-sticker { opacity: 1; }

    .record-meta { display: flex; justify-content: center; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .tag-type { font-size: 10px; padding: 3px 11px; border-radius: var(--r-pill); text-transform: uppercase; font-weight: 700; font-family: var(--font-display); }
    .tag-type.single { background: var(--lavender); color: var(--navy-deep); }
    .tag-type.album { background: var(--mint); color: var(--navy-deep); }
    .record-date { font-size: 11px; color: var(--ink-faint); font-weight: 600; }
    .record-title { font-family: var(--font-display); font-size: 14.5px; font-weight: 500; color: var(--ink); line-height: 1.4; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main class="page-shell">
    <div class="page-title-block" data-pop>
      <span class="sticker sticker-mint"><i class="fas fa-compact-disc"></i> the music</span>
      <h1>ผลงานเพลง</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-blob"></div>
      <div>กำลังโหลดข้อมูล NPT48...</div>
    </div>

    <div id="disco-view">
      <div class="chip-row" id="filterChips">
        <button class="chip active" data-type="ALL">ทั้งหมด</button>
        <button class="chip" data-type="SINGLE">ซิงเกิล</button>
        <button class="chip" data-type="ALBUM">อัลบั้ม</button>
      </div>
      <div id="disco-grid" class="record-grid pop-in-stagger" data-pop></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var discoData = [];
    var currentTypeFilter = 'ALL';

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML =
          'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(function (data) {
          discoData = data;
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('disco-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง';
        });
    }

    document.getElementById('filterChips').querySelectorAll('.chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#filterChips .chip').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTypeFilter = btn.getAttribute('data-type');
        renderGrid(currentTypeFilter);
      });
    });

    function renderGrid(type) {
      var grid = document.getElementById('disco-grid');
      var filtered = type === 'ALL' ? discoData : discoData.filter(function (d) {
        return (d.type || '').toString().toUpperCase() === type;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft)">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (d) {
        var img = window.NPT48_DATA.getDirectImgLink(d.image);
        var isAlbum = (d.type || '').toString().toUpperCase() === 'ALBUM';
        var tagClass = isAlbum ? 'album' : 'single';
        var typeLabel = isAlbum ? 'อัลบั้ม' : 'ซิงเกิล';
        var link = d.link || '#';
        return '' +
          '<div class="record-item">' +
            '<a href="' + link + '" target="_blank" class="record-link">' +
              '<div class="record-disc">' +
                '<img src="' + img + '" alt="' + d.songName + '" loading="lazy" onerror="this.style.display=\'none\'">' +
                '<span class="play-sticker"><i class="fas fa-play"></i></span>' +
              '</div>' +
              '<div class="record-meta"><span class="tag-type ' + tagClass + '">' + typeLabel + '</span><span class="record-date">' + (d.release || '') + '</span></div>' +
              '<h3 class="record-title">' + d.songName + '</h3>' +
            '</a>' +
          '</div>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
