<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official - DISCOGRAPHY</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Kanit:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">Music &amp; Releases</span>
      <h1 class="page-hero-title">Discography</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>กำลังโหลดข้อมูล NPT48...</div>
    </div>

    <div id="disco-view">
      <div class="filter-tabs" id="filterChips">
        <button class="tab-btn active" data-type="ALL">ทั้งหมด</button>
        <button class="tab-btn" data-type="SINGLE">ซิงเกิล</button>
        <button class="tab-btn" data-type="ALBUM">อัลบั้ม</button>
      </div>
      <div id="disco-grid" class="disco-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var discoData = [];
    var currentTypeFilter = 'ALL';

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(function (data) {
          discoData = data;
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('disco-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง';
        });
    }

    document.getElementById('filterChips').querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#filterChips .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTypeFilter = btn.getAttribute('data-type');
        renderGrid(currentTypeFilter);
      });
    });

    function renderGrid(type) {
      var grid = document.getElementById('disco-grid');
      var filtered = type === 'ALL' ? discoData : discoData.filter(function (d) {
        return (d.type || '').toString().toUpperCase() === type;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--ink-soft)">ไม่สามารถโหลดข้อมูลได้ กรุณาลองใหม่ภายหลัง</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (d) {
        var img = window.NPT48_DATA.getDirectImgLink(d.image);
        var isAlbum = (d.type || '').toString().toUpperCase() === 'ALBUM';
        var kickerClass = isAlbum ? 'kicker-dark' : 'kicker-outline';
        var typeLabel = isAlbum ? 'อัลบั้ม' : 'ซิงเกิล';
        var link = d.link || '#';
        return '' +
          '<div class="disco-item">' +
            '<a href="' + link + '" target="_blank" class="cover-link">' +
              '<div class="cover-box">' +
                '<img src="' + img + '" alt="' + d.songName + '" loading="lazy" onerror="this.style.display=\'none\'">' +
                '<div class="overlay"><span><i class="fas fa-play"></i> Watch MV</span></div>' +
              '</div>' +
              '<div class="item-info">' +
                '<div class="meta"><span class="kicker ' + kickerClass + '">' + typeLabel + '</span><span class="date">' + (d.release || '') + '</span></div>' +
                '<h3 class="disco-title">' + d.songName + '</h3>' +
              '</div>' +
            '</a>' +
          '</div>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
