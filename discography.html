<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPT48 Official - DISCOGRAPHY</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Kanit:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: #fbfeff;
      color: var(--npt-ink);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #loading-overlay { text-align: center; padding: 90px 0; color: var(--npt-ink-soft); font-weight: 600; letter-spacing: 1px; }
    .spinner-ring {
      width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%;
      border: 5px solid var(--npt-mist); border-top-color: var(--npt-sky); animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filter-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 44px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--npt-mist); border: none; font-family: var(--font-body); font-size: 14px; font-weight: 700;
      color: var(--npt-ink); cursor: pointer; letter-spacing: 0.5px; padding: 11px 30px; transition: all 0.2s ease;
      border-radius: var(--radius-pill);
    }
    .tab-btn.active, .tab-btn:hover { background: var(--npt-sky); }

    #disco-view { display: none; }
    .disco-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px 24px; }
    @media (max-width: 1024px) { .disco-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 680px) { .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; } }
    @media (max-width: 380px) { .disco-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; } }

    .disco-item { display: flex; flex-direction: column; align-items: center; text-align: center; transition: transform 0.3s ease; }
    .disco-item:hover { transform: translateY(-6px); }
    .cover-link { width: 100%; text-decoration: none; color: inherit; }
    .cover-box {
      width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: var(--npt-mist); margin-bottom: 14px;
      cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); position: relative;
      display: flex; align-items: center; justify-content: center; color: var(--npt-sky-deep); font-size: 2.5rem;
    }
    .cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
    .disco-item:hover .cover-box img { transform: scale(1.05); }

    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(0deg, rgba(22,50,63,0.7) 0%, transparent 60%);
      display: flex; justify-content: center; align-items: flex-end; padding-bottom: 18px;
      opacity: 0; transition: all 0.4s ease;
    }
    .overlay span {
      font-weight: 700; color: var(--npt-on-sky); background: var(--npt-sky); padding: 8px 22px; font-size: 12px;
      letter-spacing: 1px; text-transform: uppercase; border-radius: var(--radius-pill);
      transform: translateY(10px); transition: all 0.4s ease;
    }
    .disco-item:hover .overlay { opacity: 1; }
    .disco-item:hover .overlay span { transform: translateY(0); }
    @media (hover: none) {
      .overlay { opacity: 1; background: linear-gradient(0deg, rgba(22,50,63,0.35) 0%, transparent 60%); }
      .overlay span { display: none; }
    }

    .item-info { width: 100%; margin-bottom: 12px; }
    .meta { font-size: 11px; font-weight: 600; color: var(--npt-ink-faint); margin-bottom: 8px; display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tag-single, .tag-album { font-size: 10px; padding: 3px 10px; border-radius: var(--radius-pill); text-transform: uppercase; font-weight: 700; }
    .tag-single { color: var(--npt-ink); background: var(--npt-mist-deep); }
    .tag-album { color: var(--npt-ink); background: var(--npt-leaf); }
    .date { color: var(--npt-ink-faint); }
    .title { font-family: var(--font-display); font-size: 15px; font-weight: 500; margin: 0; color: var(--npt-ink); line-height: 1.4; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <h1 class="page-hero-title" data-i18n="disco_header">DISCOGRAPHY</h1>
      <div class="page-hero-underline"></div>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div data-i18n="loading_text">LOADING NPT48...</div>
    </div>

    <div id="disco-view">
      <div class="filter-tabs" id="filterTabs">
        <button class="tab-btn active" data-type="ALL" data-i18n="filter_all">ALL</button>
        <button class="tab-btn" data-type="SINGLE" data-i18n="filter_single">SINGLE</button>
        <button class="tab-btn" data-type="ALBUM" data-i18n="filter_album">ALBUM</button>
      </div>
      <div id="disco-grid" class="disco-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var discoData = [];
    var currentTypeFilter = 'ALL';

    function T(key) { return (window.NPT48_I18N && window.NPT48_I18N.t(key)) || key; }

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML =
          'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(function (data) {
          discoData = data;
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('disco-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = T('load_error');
        });
    }

    document.getElementById('filterTabs').querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#filterTabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTypeFilter = btn.getAttribute('data-type');
        renderGrid(currentTypeFilter);
      });
    });

    document.addEventListener('npt48:langchange', function () {
      if (discoData.length) renderGrid(currentTypeFilter);
    });

    function renderGrid(type) {
      var grid = document.getElementById('disco-grid');
      var filtered = type === 'ALL' ? discoData : discoData.filter(function (d) {
        return (d.type || '').toString().toUpperCase() === type;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--npt-ink-soft)">' + T('load_error') + '</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (d) {
        var img = window.NPT48_DATA.getDirectImgLink(d.image);
        var tagClass = (d.type || '').toString().toUpperCase() === 'ALBUM' ? 'tag-album' : 'tag-single';
        var typeLabel = (d.type || '').toString().toUpperCase() === 'ALBUM' ? T('filter_album') : T('filter_single');
        var link = d.link || '#';
        return '' +
          '<div class="disco-item">' +
            '<a href="' + link + '" target="_blank" class="cover-link">' +
              '<div class="cover-box">' +
                '<img src="' + img + '" alt="' + d.songName + '" onerror="this.style.display=\'none\'">' +
                '<div class="overlay"><span data-i18n="watch_mv">' + T('watch_mv') + '</span></div>' +
              '</div>' +
              '<div class="item-info">' +
                '<div class="meta"><span class="' + tagClass + '">' + typeLabel + '</span><span class="date">' + (d.release || '') + '</span></div>' +
                '<h3 class="title">' + d.songName + '</h3>' +
              '</div>' +
            '</a>' +
          '</div>';
      }).join('');
    }

    init();
  </script>
</body>
</html>
