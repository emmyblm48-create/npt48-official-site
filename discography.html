<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official Site — Discography</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Comfortaa:300,400" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">Music &amp; Releases</span>
      <h1 class="page-hero-title">Discography</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>Loading NPT48 data...</div>
    </div>

    <div id="disco-view">
      <div class="disco-filter-tabs" id="discoFilterTabs">
        <button class="disco-filter-tab active" data-type="ALL" style="--tab-color:var(--ink)">All</button>
        <button class="disco-filter-tab" data-type="SINGLE" style="--tab-color:#e0629b">Single</button>
        <button class="disco-filter-tab" data-type="ALBUM" style="--tab-color:#3fb88a">Album</button>
        <button class="disco-filter-tab" data-type="DVD" style="--tab-color:#3f8ee0">DVD/BD</button>
      </div>
      <div id="disco-grid" class="disco-grid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var discoData = [];
    var currentTypeFilter = 'ALL';
    var TYPE_LABEL = { SINGLE: 'Single', ALBUM: 'Album', DVD: 'DVD/BD' };

    function classifyType(raw) {
      var t = (raw || '').toString().toUpperCase();
      if (t.indexOf('ALBUM') !== -1) return 'ALBUM';
      if (t.indexOf('DVD') !== -1 || t.indexOf('BD') !== -1 || t.indexOf('BLU') !== -1) return 'DVD';
      return 'SINGLE';
    }

    function parseReleaseDate(raw) {
      var parts = (raw || '').toString().split(/[.\-\/]/).map(Number);
      if (parts.length === 3 && parts.every(function (n) { return !isNaN(n); })) {
        return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
      }
      var d = new Date(raw);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(function (data) {
          discoData = data.slice().sort(function (a, b) {
            return parseReleaseDate(b.release) - parseReleaseDate(a.release);
          });
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('disco-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'Unable to load data. Please try again later.';
        });
    }

    document.getElementById('discoFilterTabs').querySelectorAll('.disco-filter-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#discoFilterTabs .disco-filter-tab').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentTypeFilter = btn.getAttribute('data-type');
        renderGrid(currentTypeFilter);
      });
    });

    function renderGrid(type) {
      var grid = document.getElementById('disco-grid');
      var filtered = type === 'ALL' ? discoData : discoData.filter(function (d) {
        return classifyType(d.type) === type;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Unable to load data. Please try again later.</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (d, i) {
        var img = window.NPT48_DATA.getDirectImgLink(d.image);
        var typeKey = classifyType(d.type);
        var color = document.querySelector('.disco-filter-tab[data-type="' + typeKey + '"]').style.getPropertyValue('--tab-color');
        var link = d.link || '#';
        return '' +
          '<a href="' + link + '" target="_blank" class="disco-card" data-pop style="--i:' + (i % 9) + '">' +
            '<div class="disco-card-thumb"><img src="' + img + '" alt="' + d.songName + '" loading="lazy" decoding="async" onerror="this.style.display=\'none\'"></div>' +
            '<div class="disco-card-meta">' +
              '<span class="disco-type-pill" style="color:' + color + '">' + TYPE_LABEL[typeKey] + '</span>' +
              '<span class="disco-release-label">Release ' + (d.release || '') + '</span>' +
            '</div>' +
            '<div class="disco-card-title">' + d.songName + '</div>' +
          '</a>';
      }).join('');
      if (window.NPT48_POPIN) window.NPT48_POPIN.init();
    }

    init();
  </script>
</body>
</html>
