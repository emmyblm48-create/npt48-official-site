<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c7e8fa">
  <title>NPT48 Official Site — Discography</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&family=K2D:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main>
    <header class="page-head">
      <div class="dots" aria-hidden="true">
        <span class="dot dot--white" style="width:90px;height:90px;left:72%;top:30%;--d:9s;opacity:.7"></span>
        <span class="dot dot--yellow" style="width:20px;height:20px;left:62%;top:64%;--d:6s"></span>
        <span class="dot dot--ring" style="width:16px;height:16px;left:88%;top:70%;--d:7s"></span>
        <span class="dot dot--navy" style="width:12px;height:12px;left:52%;top:26%;--d:5s"></span>
      </div>
      <div class="page-head-inner">
        <div class="crumbs"><a href="./">HOME</a> › DISCOGRAPHY</div>
        <h1 class="page-title">Discography</h1>
        <p class="page-sub">ผลงานเพลงทั้งหมดของ NPT48</p>
      </div>
    </header>

    <div class="page-body wave-top">
      <div class="page-body-inner">
        <div id="loading-overlay">
          <div class="spinner-ring"></div>
          <div>Loading NPT48 data...</div>
        </div>

        <div id="disco-view">
          <div class="filter-tabs" id="discoFilterTabs">
            <button class="tab-btn active" data-type="ALL">ALL</button>
            <button class="tab-btn" data-type="SINGLE">SINGLE</button>
            <button class="tab-btn" data-type="ALBUM">ALBUM</button>
            <button class="tab-btn" data-type="DVD">DVD / BD</button>
          </div>
          <div id="disco-grid" class="disco-grid"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var discoData = [];
    var TYPE_LABEL = { SINGLE: 'SINGLE', ALBUM: 'ALBUM', DVD: 'DVD/BD' };

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function classifyType(raw) {
      var t = (raw || '').toString().toUpperCase();
      if (t.indexOf('ALBUM') !== -1) return 'ALBUM';
      if (t.indexOf('DVD') !== -1 || t.indexOf('BD') !== -1 || t.indexOf('BLU') !== -1) return 'DVD';
      return 'SINGLE';
    }

    function parseReleaseDate(raw) {
      var parts = (raw || '').toString().split(/[.\-\/]/).map(Number);
      if (parts.length === 3 && parts.every(function (n) { return !isNaN(n); })) {
        return new Date(parts[0], parts[1] - 1, parts[2]).getTime();
      }
      var d = new Date(raw);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(function (data) {
          discoData = data.slice().sort(function (a, b) {
            return parseReleaseDate(b.release) - parseReleaseDate(a.release);
          });
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('disco-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'Unable to load data. Please try again later.';
        });
    }

    document.getElementById('discoFilterTabs').querySelectorAll('.tab-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#discoFilterTabs .tab-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        renderGrid(btn.getAttribute('data-type'));
      });
    });

    function renderGrid(type) {
      var grid = document.getElementById('disco-grid');
      var filtered = type === 'ALL' ? discoData : discoData.filter(function (d) {
        return classifyType(d.type) === type;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p class="data-empty">No releases in this category yet.</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (d, i) {
        var img = window.NPT48_DATA.getDirectImgLink(d.image);
        var typeKey = classifyType(d.type);
        var link = d.link || '#';
        return '' +
          '<a href="' + esc(link) + '" target="_blank" rel="noopener" class="disco-card" data-pop style="--i:' + (i % 8) + '">' +
            '<div class="disco-card-thumb"><img src="' + esc(img) + '" alt="' + esc(d.songName) + '" loading="lazy" decoding="async" onerror="NPT48_DATA.imgFallback(this)"></div>' +
            '<div class="disco-card-meta">' +
              '<span class="tag tag--' + typeKey.toLowerCase() + '">' + TYPE_LABEL[typeKey] + '</span>' +
              '<span class="disco-release">' + esc(d.release || '') + '</span>' +
            '</div>' +
            '<div class="disco-card-title">' + esc(d.songName) + '</div>' +
          '</a>';
      }).join('');
      if (window.NPT48_POPIN) window.NPT48_POPIN.init();
    }

    init();
  </script>
</body>
</html>
