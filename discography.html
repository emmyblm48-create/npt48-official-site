<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>NPT48 Official Site — Discography</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/site.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body>

  <div id="site-header"></div>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/reveal.js"></script>

  <main class="page-shell">
    <div class="page-hero">
      <span class="eyebrow">Music &amp; Releases</span>
      <h1 class="page-hero-title">Discography</h1>
    </div>

    <div id="loading-overlay">
      <div class="spinner-ring"></div>
      <div>Loading NPT48 data...</div>
    </div>

    <div id="disco-view">
      <div class="disco-select-wrap">
        <div class="select-shell">
          <select id="typeSelect" class="disco-select">
            <option value="ALL">All</option>
            <option value="SINGLE">Single</option>
            <option value="ALBUM">Album</option>
          </select>
          <i class="fas fa-chevron-down select-chevron"></i>
        </div>
      </div>
      <div id="disco-grid" class="disco-list"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script>
    var discoData = [];
    var currentTypeFilter = 'ALL';

    function init() {
      if (!window.NPT48_DATA.isConfigured()) {
        document.getElementById('loading-overlay').innerHTML = 'Google Sheets not connected yet — set SCRIPT_URL in <code>assets/js/data.js</code>';
        return;
      }
      window.NPT48_DATA.fetchSheet('Discography')
        .then(function (data) {
          discoData = data;
          renderGrid('ALL');
          document.getElementById('loading-overlay').style.display = 'none';
          document.getElementById('disco-view').style.display = 'block';
        })
        .catch(function () {
          document.getElementById('loading-overlay').innerHTML = 'Unable to load data. Please try again later.';
        });
    }

    document.getElementById('typeSelect').addEventListener('change', function () {
      currentTypeFilter = this.value;
      renderGrid(currentTypeFilter);
    });

    function renderGrid(type) {
      var grid = document.getElementById('disco-grid');
      var filtered = type === 'ALL' ? discoData : discoData.filter(function (d) {
        return (d.type || '').toString().toUpperCase() === type;
      });

      if (!filtered.length) {
        grid.innerHTML = '<p style="text-align:center;color:var(--ink-soft)">Unable to load data. Please try again later.</p>';
        return;
      }

      grid.innerHTML = filtered.map(function (d, i) {
        var img = window.NPT48_DATA.getDirectImgLink(d.image);
        var isAlbum = (d.type || '').toString().toUpperCase() === 'ALBUM';
        var kickerClass = isAlbum ? 'kicker-dark' : 'kicker-outline';
        var typeLabel = isAlbum ? 'Album' : 'Single';
        var link = d.link || '#';
        return '' +
          '<a href="' + link + '" target="_blank" class="disco-row" data-pop style="--i:' + (i % 8) + '">' +
            '<div class="disco-row-thumb"><img src="' + img + '" alt="' + d.songName + '" loading="lazy" onerror="this.style.display=\'none\'"></div>' +
            '<div class="disco-row-info">' +
              '<span class="kicker ' + kickerClass + '">' + typeLabel + '</span>' +
              '<div class="disco-row-title">' + d.songName + '</div>' +
              '<div class="disco-row-date">' + (d.release || '') + ' Release</div>' +
            '</div>' +
          '</a>';
      }).join('');
      if (window.NPT48_POPIN) window.NPT48_POPIN.init();
    }

    init();
  </script>
</body>
</html>
